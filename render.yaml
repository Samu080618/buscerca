# Despliegue en Render (https://render.com): New > Blueprint > elegir este repositorio.
# Crea la base PostgreSQL (con PostGIS) y la API. La primera carga de datos se hace sola al arrancar.
services:
  - type: web
    name: buscerca-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python seed.py --demo --si-vacia && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buscerca-db
          property: connectionString
      - key: JWT_SECRETO
        generateValue: true
      - key: SIMULAR_BUSES        # mueve solos los buses de prueba para la demostración
        value: "1"
      - key: TZ                   # hora de Colombia para las reglas de señal y llegada
        value: America/Bogota
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: buscerca-db
    plan: free
    databaseName: buscerca_db
    user: buscerca
    postgresMajorVersion: "16"
