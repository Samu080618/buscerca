# Ejecuta los 44 casos de prueba de la API en cada cambio (evidencia en la pestaña Actions).
name: Pruebas API

on:
  push:
    branches: [main]
    paths: ["backend/**", "database/**", ".github/workflows/pruebas.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: buscerca
          POSTGRES_PASSWORD: buscerca
          POSTGRES_DB: buscerca_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buscerca:buscerca@localhost:5432/buscerca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -v
