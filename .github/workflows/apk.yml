# Compila la app Android en GitHub (sin instalar Android Studio) y deja el APK para descargar.
# La dirección de la API se toma de Settings > Secrets and variables > Actions > Variables > API_URL.
name: APK Android

on:
  push:
    branches: [main]
    paths: ["app-android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias y APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PapiUrl="${{ vars.API_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BusCerca-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
